[tool.poetry]
name = "pokeai"
version = "0.1.0"
description = "Pokémon Showdown RL agent"
authors = ["Andrea Marzella <anmastdev@gmail.com>"]
packages = [{ include = "*", from = "src" }]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.11"
poke-env = ">=0.8"
wandb = "^0.26.0"
python-dotenv = "^1.2.2"
stable-baselines3 = { extras = ["extra"], version = "^2.8.0" }
numpy = "^2.4.4"
tensorboard = "^2.20.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"
jupyter = "^1.0"
ipykernel = "^6.0"
ruff = "^0.15.13"
mypy = "^2.1.0"
pytest-asyncio = "^1.3.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

# ── ruff ──────────────────────────────────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "F",  # pyflakes (unused imports, undefined names)
    "I",  # isort (import ordering)
    "UP", # pyupgrade (modern Python syntax)
    "B",  # flake8-bugbear (common bugs)
]
ignore = [
    "E501", # line too long — handled by formatter, not lint
    "B008", # do not perform function calls in default arguments
]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["E402"] # sys.path.insert at top of scripts is intentional

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ── mypy ──────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true # poke-env has incomplete stubs
disallow_untyped_defs = false # too strict for now, enable after RLlib migration

[[tool.mypy.overrides]]
module = ["poke_env.*", "stable_baselines3.*", "wandb.*", "gymnasium.*"]
ignore_missing_imports = true

# ── pytest ────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
